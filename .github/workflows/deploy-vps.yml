name: Deploy to VPS

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.repository == 'everaldojuniorr/scoreboard-jiujitsu'
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t scoreboard-jiujitsu:latest .

      - name: Save image tarball
        run: docker save scoreboard-jiujitsu:latest | gzip > scoreboard-jiujitsu.tar.gz

      - name: Copy image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: scoreboard-jiujitsu.tar.gz
          target: /tmp/

      - name: Load and run on VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -euo pipefail
            docker load -i /tmp/scoreboard-jiujitsu.tar.gz
            docker stop scoreboard-jiujitsu 2>/dev/null || true
            docker rm scoreboard-jiujitsu 2>/dev/null || true
            docker run -d --name scoreboard-jiujitsu --restart unless-stopped -p 43123:3000 scoreboard-jiujitsu:latest
            rm -f /tmp/scoreboard-jiujitsu.tar.gz
